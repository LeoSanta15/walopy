[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walopy"
dynamic = ["version"]
description = "Herramientas de investigación de operaciones: colas, inventarios, scheduling, CPM/PERT, confiabilidad, OEE, cuellos de botella y árboles de KPI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeoSanta15", email = "angelsanta1@gmail.com" }]
keywords = [
    "operations research", "queuing theory", "little's law", "kingman",
    "inventory", "EOQ", "MRP", "ABC analysis", "scheduling", "flow-shop",
    "CPM", "PERT", "reliability", "weibull",
    "bottleneck", "OEE", "KPI",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.22", "pandas>=1.4", "matplotlib>=3.5", "plotly>=5.0"]

[project.optional-dependencies]
dev     = ["pytest>=7", "pytest-cov>=4", "pytest-timeout>=2", "ruff~=0.16.10", "mypy>=1.10,<3"]
release = ["build", "twine", "pip-audit"]
docs    = ["sphinx>=7", "sphinx-rtd-theme>=2", "myst-parser>=2", "sphinx-intl>=2.1"]

[project.urls]
Homepage  = "https://github.com/LeoSanta15/walopy"
Issues    = "https://github.com/LeoSanta15/walopy/issues"
Changelog = "https://github.com/LeoSanta15/walopy/blob/main/CHANGELOG.md"
"README (English)" = "https://github.com/LeoSanta15/walopy/blob/main/README.en.md"

[tool.setuptools.dynamic]
version = {attr = "walopy.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
walopy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/walopy"]
addopts   = "-q --doctest-modules --import-mode=importlib"
filterwarnings = [
    "error",
    # matplotlib 3.5 con pyparsing >= 3.1 en Python 3.9: aviso de terceros ajeno a walopy
    "ignore:.*deprecated - use.*:DeprecationWarning",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length    = 110
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "B", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]
"benchmarks/*" = ["S311"]

[tool.coverage.run]
source = ["walopy"]

[tool.coverage.report]
fail_under = 85
show_missing = true
