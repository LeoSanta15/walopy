name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  verificar:
    name: Verificar antes de publicar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev,release]"

      - name: Tests
        run: pytest tests/ -q --tb=short

      - name: Linter y tipos
        run: |
          ruff check src/ tests/ benchmarks/ scripts/ examples/
          mypy src/walopy --ignore-missing-imports

  build:
    name: Build distribution
    needs: verificar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*

      - name: El wheel construido tiene la versión del tag
        # release published: GITHUB_REF_NAME es el tag (vX.Y.Z); un tag creado antes de subir la versión
        # produciría artefactos antiguos y PyPI respondería 400 File exists.
        run: python scripts/comprobar_version_release.py "$GITHUB_REF_NAME" dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/walopy/

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
